name: Error
description: Algo no funciona como debería
title: "Error: "
labels: ["bug"]
body:
  - type: textarea
    id: que
    attributes:
      label: ¿Qué pasó?
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      value: |
        1. Entrar como (correo / rol): …
        2. Ir a …
        3. Hacer …
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas que pasara
  - type: textarea
    id: logs
    attributes:
      label: Mensajes de error
      description: Texto de la terminal del backend o de la consola del navegador. Una captura también sirve.
      render: shell
  - type: input
    id: historia
    attributes:
      label: Historia relacionada (si aplica)
      placeholder: HU-03
